plugins {
    id 'java-library'
    id 'jacoco'
    id 'org.sonarqube' version '7.2.3.7755'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure { distributionType = Wrapper.DistributionType.BIN }

version = mod_version
group = mod_group_id

jacoco { toolVersion = '0.8.14' }

sonar {
    properties {
        property 'sonar.organization', 'growthcraftce'
        property 'sonar.projectKey', 'GrowthcraftCE_Growthcraft-Deco'
        property 'sonar.projectName', 'Growthcraft Decorations (NeoForge)'
        property 'sonar.projectVersion', project.version.toString()
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.java.source', '25'
        property 'sonar.java.target', '25'
        property 'sonar.coverage.jacoco.xmlReportPaths', layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path
        property 'sonar.exclusions', ['src/generated/**', 'src/main/resources/**', 'run/**', '.decompiled/**'].join(',')
    }
}

base { archivesName = mod_archive_base }

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/' }
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            jvmArgument '-Xmx2G'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version_short}-neoforge:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version_short}-neoforge:${jei_version}"
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test).configure {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}
tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
tasks.withType(ProcessResources).configureEach { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
